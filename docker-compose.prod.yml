version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: voxomate-mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: voxomate
      MYSQL_ROOT_PASSWORD: RootPassword123
    ports:
      - "3307:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxomate-backend-prod
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql+aiomysql://root:RootPassword123@db:3306/voxomate
      - SECRET_KEY=prod_secret_key_change_me_to_something_secure_64_characters
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001/api/v1
    container_name: voxomate-frontend-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  mysql_prod_data:
